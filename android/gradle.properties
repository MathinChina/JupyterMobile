# 本机物理内存仅 5.5GiB，原先 -Xmx8G/-XX:MaxMetaspaceSize=4G 会触发 OOM 被系统 kill。
# 调低 JVM 堆并限制 worker 并行度，避免 native strip 阶段内存峰值打爆。
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/37.0.0/aapt2
